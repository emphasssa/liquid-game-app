<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Liquid Glass App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Quicksand', sans-serif;
      min-height: 100vh;
      background-color: #fbf8fc;
      overflow-x: hidden;
      padding: 90px 20px 100px 20px; /* Отступы для панелей */
      display: flex; flex-direction: column; align-items: center;
    }
    
    /* ФОН */
    .ambient-bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
    .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.65; }
    .blob-1 { width: 320px; height: 320px; background: radial-gradient(circle, #ffe3ec, #ffd6e0); top: -60px; left: -50px; }
    .blob-2 { width: 360px; height: 360px; background: radial-gradient(circle, #e2eafc, #c1d3fe); bottom: -80px; right: -60px; }

    /* ОБЩИЙ СТИЛЬ СТЕКЛА */
    .glass {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 10px 30px rgba(180, 160, 200, 0.12), inset 0 1px 2px rgba(255, 255, 255, 0.9);
    }

    /* ВЕРХНЯЯ ПАНЕЛЬ */
    .top-bar {
      position: fixed; top: 15px; left: 15px; right: 15px;
      border-radius: 20px; padding: 12px 20px;
      display: flex; justify-content: space-between;
      z-index: 100;
    }
    .resource { display: flex; align-items: center; gap: 8px; font-weight: 700; color: #3d3b4f; }
    .resource-val { font-variant-numeric: tabular-nums; font-size: 16px; }

    /* ОСНОВНОЙ БЛОК */
    .glass-card { width: 100%; max-width: 380px; padding: 28px 24px; border-radius: 36px; z-index: 1; display: flex; flex-direction: column; gap: 26px; }
    .section-label { font-size: 13px; font-weight: 600; color: #7b7891; text-transform: uppercase; margin-bottom: 8px; }

    /* КНОПКА */
    .liquid-btn {
      width: 100%; padding: 16px; font-family: inherit; font-size: 16px; font-weight: 700; color: #3b374d;
      background: rgba(255, 255, 255, 0.18); border-radius: 22px; cursor: pointer; outline: none; border: none;
      box-shadow: 0 10px 20px rgba(160, 140, 180, 0.08), inset 0 1px 2px rgba(255, 255, 255, 0.8);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      transition: all 0.2s;
    }
    .liquid-btn.pop-anim { animation: liquidPop 0.35s ease-out; }
    @keyframes liquidPop {
      0% { transform: scale(0.96) scaleX(1.04); border-radius: 26px 18px 26px 18px; background: rgba(255,255,255,0.4); }
      50% { transform: scale(1.02) scaleX(0.98); border-radius: 18px 26px 18px 26px; }
      100% { transform: scale(1) scaleX(1); border-radius: 22px; }
    }

    /* СЛАЙДЕР */
    .slider-header { display: flex; justify-content: space-between; margin-bottom: 6px;}
    .slider-value { font-weight: 700; font-size: 14px; color: #6a6485; font-variant-numeric: tabular-nums; }
    .slider-container { position: relative; height: 38px; display: flex; align-items: center; }
    .dots-track { position: absolute; left: 14px; right: 14px; height: 6px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 1; }
    .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(120, 110, 140, 0.3); transition: all 0.15s; }
    .dot.active { background: #7367f0; transform: scale(1.4); }
    .liquid-slider { -webkit-appearance: none; width: 100%; height: 12px; border-radius: 10px; background: rgba(255,255,255,0.35); border: 1px solid rgba(255,255,255,0.7); outline: none; z-index: 2; }
    .liquid-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.9); border: 1.5px solid #fff; box-shadow: 0 4px 10px rgba(110,90,140,0.25); transition: transform 0.15s; }
    .liquid-slider:active::-webkit-slider-thumb { transform: scale(1.15); }

    /* ТУМБЛЕР */
    .switch-section { display: flex; align-items: center; justify-content: space-between; }
    .drag-toggle { position: relative; width: 68px; height: 38px; border-radius: 20px; background: rgba(230, 230, 240, 0.5); border: 1.5px solid rgba(255,255,255,0.8); transition: background 0.25s; cursor: pointer; touch-action: none; }
    .drag-toggle.is-on { background: rgba(147, 134, 250, 0.45); border-color: rgba(255,255,255,0.95); }
    .toggle-thumb { position: absolute; top: 3px; left: 3px; width: 29px; height: 29px; border-radius: 50%; background: #fff; border: 1px solid #fff; box-shadow: 0 3px 8px rgba(100,80,130,0.2); transition: transform 0.2s, width 0.15s; pointer-events: none; }
    .toggle-thumb.dragging { width: 33px; border-radius: 14px; }

    /* НИЖНЯЯ НАВИГАЦИЯ */
    .bottom-nav {
      position: fixed; bottom: 20px; left: 20px; right: 20px;
      border-radius: 30px; padding: 10px 20px;
      display: flex; justify-content: space-around;
      z-index: 100;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: #7b7891; font-size: 11px; font-weight: 700; opacity: 0.6; transition: all 0.2s; cursor: pointer;
    }
    .nav-item.active { opacity: 1; color: #7367f0; transform: translateY(-3px); }
    .nav-icon { font-size: 20px; }

    /* МОДАЛЬНОЕ ОКНО */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(20, 15, 30, 0.4);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      z-index: 1000; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease; padding: 20px;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-card {
      width: 100%; max-width: 320px; background: rgba(255, 255, 255, 0.7);
      padding: 30px 24px; border-radius: 32px; text-align: center;
      transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .modal-overlay.active .modal-card { transform: scale(1); }
    .modal-title { font-size: 22px; font-weight: 700; color: #3d3b4f; margin-bottom: 12px; }
    .modal-text { font-size: 15px; color: #6a6485; margin-bottom: 24px; line-height: 1.4; }
  </style>
</head>
<body>

  <div class="ambient-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <!-- Верхняя панель ресурсов -->
  <div class="top-bar glass">
    <div class="resource"><span>⚡</span> <span class="resource-val">120/120</span></div>
    <div class="resource"><span>💰</span> <span class="resource-val" id="moneyVal">1 250</span></div>
  </div>

  <!-- Основной контент -->
  <div class="glass-card glass">
    <div style="text-align:center; font-size: 20px; font-weight: 700; color: #3d3b4f;">Настройки</div>

    <!-- Кнопка -->
    <div>
      <div class="section-label">Действие</div>
      <button class="liquid-btn" id="openModalBtn">Открыть модалку</button>
    </div>

    <!-- Слайдер -->
    <div>
      <div class="slider-header">
        <span class="section-label" style="margin:0;">Отсечки (10 шагов)</span>
        <span class="slider-value" id="sliderVal">50%</span>
      </div>
      <div class="slider-container">
        <div class="dots-track" id="dotsTrack">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="dot"></span><span class="dot active"></span><span class="dot"></span><span class="dot"></span>
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
        <input type="range" min="0" max="100" step="1" value="50" class="liquid-slider" id="liquidSlider">
      </div>
    </div>

    <!-- Тумблер -->
    <div class="switch-section">
      <div class="section-label" style="margin:0;">Интерактивный свитч</div>
      <div class="drag-toggle" id="toggleTrack">
        <div class="toggle-thumb" id="toggleThumb"></div>
      </div>
    </div>
  </div>

  <!-- Нижняя панель навигации -->
  <div class="bottom-nav glass">
    <div class="nav-item active" data-tab="home">
      <div class="nav-icon">🏠</div><span>База</span>
    </div>
    <div class="nav-item" data-tab="inventory">
      <div class="nav-icon">🎒</div><span>Склад</span>
    </div>
    <div class="nav-item" data-tab="settings">
      <div class="nav-icon">⚙️</div><span>Опции</span>
    </div>
  </div>

  <!-- Модальное окно -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card glass">
      <div class="modal-title">Привет! 👋</div>
      <div class="modal-text">Это стеклянное модальное окно. Фон позади красиво размыт.</div>
      <button class="liquid-btn" id="closeModalBtn" style="background: rgba(115, 103, 240, 0.15); border-color: rgba(115, 103, 240, 0.4); color: #7367f0;">Закрыть</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    function hapticImpact(style = 'light') {
      try { tg?.HapticFeedback ? tg.HapticFeedback.impactOccurred(style) : navigator.vibrate?.(10); } catch(e){}
    }
    function hapticSelection() {
      try { tg?.HapticFeedback ? tg.HapticFeedback.selectionChanged() : navigator.vibrate?.(8); } catch(e){}
    }

    // 1. Модальное окно и главная кнопка
    const openBtn = document.getElementById('openModalBtn');
    const closeBtn = document.getElementById('closeModalBtn');
    const modal = document.getElementById('modalOverlay');

    openBtn.addEventListener('pointerdown', () => {
      hapticImpact('medium');
      openBtn.classList.remove('pop-anim'); void openBtn.offsetWidth; openBtn.classList.add('pop-anim');
      setTimeout(() => modal.classList.add('active'), 150);
    });
    
    closeBtn.addEventListener('pointerdown', () => {
      hapticImpact('light');
      closeBtn.classList.remove('pop-anim'); void closeBtn.offsetWidth; closeBtn.classList.add('pop-anim');
      setTimeout(() => modal.classList.remove('active'), 150);
    });

    // 2. Слайдер
    const slider = document.getElementById('liquidSlider');
    const sliderVal = document.getElementById('sliderVal');
    const dots = document.querySelectorAll('#dotsTrack .dot');
    let lastStep = 5;

    slider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value, 10);
      sliderVal.textContent = val + '%';
      const step = Math.round(val / 10);
      if (step !== lastStep) {
        lastStep = step;
        hapticSelection();
        dots.forEach((d, i) => d.classList.toggle('active', i === step));
      }
    });

    // 3. Тумблер (Drag & Drop)
    const track = document.getElementById('toggleTrack');
    const thumb = document.getElementById('toggleThumb');
    let isOn = false, isDragging = false, startX = 0, currentX = 0;
    const maxTranslate = 30;

    function setToggle(state) {
      isOn = state;
      track.classList.toggle('is-on', isOn);
      thumb.style.transform = `translateX(${isOn ? maxTranslate : 0}px)`;
      hapticImpact('light');
    }

    track.addEventListener('pointerdown', (e) => {
      isDragging = true; startX = e.clientX; currentX = isOn ? maxTranslate : 0;
      thumb.classList.add('dragging'); track.setPointerCapture(e.pointerId);
    });
    track.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      let newX = Math.max(0, Math.min(maxTranslate, (isOn ? maxTranslate : 0) + (e.clientX - startX)));
      thumb.style.transform = `translateX(${newX}px)`; currentX = newX;
    });
    const endDrag = () => {
      if (!isDragging) return;
      isDragging = false; thumb.classList.remove('dragging');
      setToggle(Math.abs(currentX - (isOn ? maxTranslate : 0)) < 6 ? !isOn : currentX > maxTranslate / 2);
    };
    track.addEventListener('pointerup', endDrag); track.addEventListener('pointercancel', endDrag);

    // 4. Навигация (Табы)
    document.querySelectorAll('.nav-item').forEach(tab => {
      tab.addEventListener('pointerdown', () => {
        if(tab.classList.contains('active')) return;
        hapticSelection();
        document.querySelector('.nav-item.active').classList.remove('active');
        tab.classList.add('active');
      });
    });
  </script>
</body>
</html>
