<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- Строгие правила для блокировки системного зума и скейла -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Liquid Glass Hub</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Google Font: Quicksand -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ================= СТРОГИЕ НАСТРОЙКИ (iOS / TG ФИКСЫ) ================= */
    html, body {
      margin: 0; padding: 0; overflow: hidden;
      width: 100vw; height: 100vh; position: fixed;
      overscroll-behavior: none; touch-action: none;
      user-select: none; -webkit-user-select: none;
      font-family: 'Quicksand', sans-serif;
      background: #000;
    }
    
    * {
      box-sizing: border-box; touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ================= ФОНЫ (ТЕМЫ) ================= */
    .bg-layer {
      position: absolute; inset: 0; opacity: 0; pointer-events: none;
      transition: opacity 0.6s ease-in-out;
    }
    .bg-layer.active { opacity: 1; }

    #bg0 { background: radial-gradient(circle at 30% 30%, #ffd6e0, #c1d3fe); }
    #bg1 { background: radial-gradient(circle at 70% 30%, #a4cafe, #81e6d9); }
    #bg2 { background: radial-gradient(circle at 50% 80%, #ffc2d1, #ffb347); }
    #bg3 { background: radial-gradient(circle at 20% 70%, #9ae6b4, #fefcbf); }

    /* ================= ЛАЙАУТ (СЕТКА) ================= */
    .main-layout {
      position: relative; z-index: 10;
      display: flex; width: 100vw; height: 100vh;
    }

    /* ЛЕВАЯ ЧАСТЬ (85%) - КОНТЕЙНЕР ЭКРАНОВ */
    .left-side {
      width: 85%; position: relative;
    }

    .screen {
      position: absolute; inset: 0;
      padding: 30px 15px 30px 30px;
      opacity: 0; pointer-events: none;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transform: scale(0.95);
    }
    .screen.active {
      opacity: 1; pointer-events: all;
      transform: scale(1);
    }

    /* ПРАВАЯ ЧАСТЬ (15%) - ВЕРТИКАЛЬНЫЙ СЛАЙДЕР */
    .right-side {
      width: 15%; display: flex; justify-content: center; padding: 40px 0;
    }

    .glass-style {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border: 1.5px solid rgba(255,255,255,0.4);
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    .v-track {
      width: 20px; height: 100%; border-radius: 20px;
      position: relative; cursor: pointer;
    }
    .v-thumb {
      position: absolute; left: 0; right: 0; height: 60px;
      border-radius: 20px; background: rgba(255,255,255,0.9);
      border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      top: 0; /* Управляется через JS */
    }
    .v-thumb.snapping { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }

    /* ================= ЭКРАН 0: КРАФТ (ЖИДКАЯ КНОПКА) ================= */
    .craft-btn {
      width: 200px; height: 200px; border-radius: 50%;
      position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .water-fill {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 0%; /* Меняется через JS */
      background: linear-gradient(180deg, #7367f0 0%, #ce9ffc 100%);
      opacity: 0.8; z-index: 1;
    }
    .craft-text {
      position: relative; z-index: 2; font-weight: 700;
      color: #3b374d; text-align: center;
      text-shadow: 0 2px 4px rgba(255,255,255,0.5);
    }
    .title { position: absolute; top: 40px; font-size: 24px; font-weight: 700; color: #3b374d; }

    /* ================= ЭКРАН 1: РЯБЬ НА ВОДЕ ================= */
    .ripple-pad {
      width: 90%; height: 60%; border-radius: 30px;
      position: relative; overflow: hidden;
    }
    .ripple {
      position: absolute; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.8);
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: rippleAnim 0.8s ease-out forwards;
    }
    @keyframes rippleAnim {
      0% { width: 10px; height: 10px; opacity: 1; border-width: 4px; }
      100% { width: 150px; height: 150px; opacity: 0; border-width: 1px; }
    }

    /* ================= ЭКРАН 2: ЭЛАСТИЧНЫЙ СВИТЧ ================= */
    .elastic-track {
      width: 80%; height: 80px; border-radius: 40px;
      position: relative; display: flex; align-items: center;
      padding: 10px;
    }
    .elastic-thumb {
      width: 60px; height: 60px; border-radius: 30px;
      background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      position: absolute; left: 10px; pointer-events: none;
    }
    .elastic-thumb.snapping { transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

    /* ================= ЭКРАН 3: СЛАЙДЕР НАСТРОЕК ================= */
    .slider-container { width: 90%; position: relative; height: 40px; display: flex; align-items: center; }
    .dots-track { position: absolute; left: 15px; right: 15px; height: 6px; display: flex; justify-content: space-between; align-items: center; z-index: 1; pointer-events: none; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.4); }
    .dot.active { background: #7367f0; transform: scale(1.5); }
    .h-slider {
      -webkit-appearance: none; width: 100%; height: 12px; border-radius: 10px;
      background: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.6);
      outline: none; z-index: 2; margin: 0;
    }
    .h-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 34px; height: 34px; border-radius: 50%;
      background: #fff; border: 1px solid rgba(200,190,220,0.5);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.15s;
    }
    .h-slider:active::-webkit-slider-thumb { transform: scale(1.15); }
  </style>
</head>
<body>

  <!-- Фоны -->
  <div id="bg0" class="bg-layer active"></div>
  <div id="bg1" class="bg-layer"></div>
  <div id="bg2" class="bg-layer"></div>
  <div id="bg3" class="bg-layer"></div>

  <div class="main-layout">
    
    <!-- Левая часть: Экраны -->
    <div class="left-side">
      
      <!-- Экран 0: Синтез (Жидкая кнопка) -->
      <div id="screen-0" class="screen active">
        <div class="title">Зажмите для синтеза</div>
        <div class="craft-btn glass-style" id="craftBtn">
          <div class="water-fill" id="waterFill"></div>
          <div class="craft-text" id="craftText">Синтез</div>
        </div>
      </div>

      <!-- Экран 1: Водная гладь (Рябь) -->
      <div id="screen-1" class="screen">
        <div class="title">Гладить воду</div>
        <div class="ripple-pad glass-style" id="ripplePad"></div>
      </div>

      <!-- Экран 2: Эластичный свитч -->
      <div id="screen-2" class="screen">
        <div class="title">Предохранитель</div>
        <div class="elastic-track glass-style" id="elasticTrack">
          <div class="elastic-thumb" id="elasticThumb"></div>
        </div>
      </div>

      <!-- Экран 3: Калибровка -->
      <div id="screen-3" class="screen">
        <div class="title">Калибровка</div>
        <div class="slider-container">
          <div class="dots-track" id="dotsTrack">
            <span class="dot"></span><span class="dot active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
          </div>
          <input type="range" min="0" max="40" step="10" value="10" class="h-slider" id="hSlider">
        </div>
      </div>

    </div>

    <!-- Правая часть: Вертикальный ползунок -->
    <div class="right-side">
      <div class="v-track glass-style" id="vTrack">
        <div class="v-thumb snapping" id="vThumb" style="transform: translateY(0px);"></div>
      </div>
    </div>
  </div>

  <script>
    // ================= НАСТРОЙКИ СИСТЕМЫ И TG =================
    const tg = window.Telegram?.WebApp;
    if(tg) {
      tg.expand();
      tg.disableVerticalSwipes?.(); // Фикс от случайного закрытия свайпом
    }

    // Запрет скролла и зума на всей странице для iOS
    document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

    function haptic(type = 'light') {
      try { tg?.HapticFeedback ? tg.HapticFeedback.impactOccurred(type) : navigator.vibrate?.(type === 'heavy' ? 50 : 10); } catch(e){}
    }

    // Генерация звука (AudioContext)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSuccessSound() {
      if(audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.frequency.value = freq; 
        osc.connect(gain); 
        gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(0, t + i*0.1);
        gain.gain.linearRampToValueAtTime(0.2, t + i*0.1 + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.01, t + i*0.1 + 0.3);
        osc.start(t + i*0.1); 
        osc.stop(t + i*0.1 + 0.3);
      });
    }

    // ================= НАВИГАЦИЯ (ВЕРТИКАЛЬНЫЙ СЛАЙДЕР) =================
    const vTrack = document.getElementById('vTrack');
    const vThumb = document.getElementById('vThumb');
    let vDragging = false, vMaxY = 0, currentScreen = 0;

    function initVSlider() {
      vMaxY = vTrack.clientHeight - vThumb.clientHeight;
      setVSliderIndex(currentScreen, false);
    }
    window.addEventListener('resize', initVSlider);
    setTimeout(initVSlider, 100);

    function switchScreen(index) {
      if(currentScreen === index) return;
      currentScreen = index;
      haptic('light');

      // Смена экранов
      document.querySelectorAll('.screen').forEach((s, i) => {
        s.classList.toggle('active', i === index);
      });
      // Смена фонов
      document.querySelectorAll('.bg-layer').forEach((bg, i) => {
        bg.classList.toggle('active', i === index);
      });
    }

    function setVSliderIndex(index, animate = true) {
      const targetY = (index / 3) * vMaxY;
      if (animate) vThumb.classList.add('snapping');
      vThumb.style.transform = `translateY(${targetY}px)`;
      switchScreen(index);
    }

    vTrack.addEventListener('pointerdown', (e) => {
      vDragging = true;
      vThumb.classList.remove('snapping');
      vTrack.setPointerCapture(e.pointerId);
      processVMove(e);
    });

    function processVMove(e) {
      if (!vDragging) return;
      const rect = vTrack.getBoundingClientRect();
      let newY = e.clientY - rect.top - (vThumb.clientHeight / 2);
      newY = Math.max(0, Math.min(vMaxY, newY));
      vThumb.style.transform = `translateY(${newY}px)`;
      
      const index = Math.round((newY / vMaxY) * 3);
      switchScreen(index);
    }

    vTrack.addEventListener('pointermove', processVMove);
    
    const endVDrag = () => {
      if (!vDragging) return;
      vDragging = false;
      setVSliderIndex(currentScreen, true);
    };
    vTrack.addEventListener('pointerup', endVDrag);
    vTrack.addEventListener('pointercancel', endVDrag);

    // ================= ЭКРАН 0: КРАФТ =================
    const craftBtn = document.getElementById('craftBtn');
    const waterFill = document.getElementById('waterFill');
    const craftText = document.getElementById('craftText');
    let fillProgress = 0, isHolding = false, craftCooldown = false, animFrame;

    function craftLoop() {
      if (!isHolding || craftCooldown) return;
      fillProgress += 1.2; // Скорость заполнения (~1.5 сек до 100)
      
      if (fillProgress >= 100) {
        fillProgress = 100;
        isHolding = false;
        craftCooldown = true;
        waterFill.style.height = '100%';
        craftText.textContent = "Успех!";
        craftText.style.color = "#fff";
        
        haptic('heavy');
        playSuccessSound();
        confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });

        setTimeout(() => {
          fillProgress = 0;
          waterFill.style.transition = 'height 0.4s ease';
          waterFill.style.height = '0%';
          craftText.textContent = "Синтез";
          craftText.style.color = "#3b374d";
          setTimeout(() => { 
            waterFill.style.transition = 'none';
            craftCooldown = false; 
          }, 400);
        }, 2000);
      } else {
        waterFill.style.height = fillProgress + '%';
        animFrame = requestAnimationFrame(craftLoop);
      }
    }

    function drainWater() {
      isHolding = false;
      cancelAnimationFrame(animFrame);
      if (fillProgress > 0 && fillProgress < 100 && !craftCooldown) {
        waterFill.style.transition = 'height 0.3s ease';
        waterFill.style.height = '0%';
        fillProgress = 0;
        setTimeout(() => waterFill.style.transition = 'none', 300);
      }
    }

    craftBtn.addEventListener('pointerdown', (e) => {
      if (craftCooldown) return;
      if (audioCtx.state === 'suspended') audioCtx.resume(); // Инит звука по первому тапу
      craftBtn.setPointerCapture(e.pointerId);
      isHolding = true;
      waterFill.style.transition = 'none';
      haptic('light');
      animFrame = requestAnimationFrame(craftLoop);
    });
    craftBtn.addEventListener('pointerup', drainWater);
    craftBtn.addEventListener('pointercancel', drainWater);


    // ================= ЭКРАН 1: РЯБЬ (RIPPLES) =================
    const ripplePad = document.getElementById('ripplePad');
    let lastRippleTime = 0;

    function createRipple(e) {
      const now = Date.now();
      if(now - lastRippleTime < 50) return; // Ограничение частоты
      lastRippleTime = now;

      haptic('light');
      const rect = ripplePad.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const r = document.createElement('div');
      r.className = 'ripple';
      r.style.left = x + 'px';
      r.style.top = y + 'px';
      ripplePad.appendChild(r);

      setTimeout(() => r.remove(), 800);
    }

    ripplePad.addEventListener('pointerdown', (e) => {
      ripplePad.setPointerCapture(e.pointerId);
      createRipple(e);
    });
    ripplePad.addEventListener('pointermove', (e) => {
      if(ripplePad.hasPointerCapture(e.pointerId)) createRipple(e);
    });


    // ================= ЭКРАН 2: ЭЛАСТИЧНЫЙ СВИТЧ =================
    const eTrack = document.getElementById('elasticTrack');
    const eThumb = document.getElementById('elasticThumb');
    let eDrag = false, eMaxX = 0;

    eTrack.addEventListener('pointerdown', (e) => {
      eDrag = true;
      eMaxX = eTrack.clientWidth - eThumb.clientWidth - 20; // 10px padding с каждой стороны
      eThumb.classList.remove('snapping');
      eTrack.setPointerCapture(e.pointerId);
      moveElastic(e);
    });

    function moveElastic(e) {
      if(!eDrag) return;
      const rect = eTrack.getBoundingClientRect();
      let x = e.clientX - rect.left - 10 - (eThumb.clientWidth / 2);
      x = Math.max(0, Math.min(eMaxX, x));
      eThumb.style.transform = `translateX(${x}px)`;
    }

    eTrack.addEventListener('pointermove', moveElastic);

    const endElastic = (e) => {
      if(!eDrag) return;
      eDrag = false;
      const rect = eTrack.getBoundingClientRect();
      let currentX = e.clientX - rect.left;
      let targetX = currentX > (rect.width / 2) ? eMaxX : 0;
      
      eThumb.classList.add('snapping');
      eThumb.style.transform = `translateX(${targetX}px)`;
      haptic(targetX > 0 ? 'medium' : 'light');
    };
    eTrack.addEventListener('pointerup', endElastic);
    eTrack.addEventListener('pointercancel', endElastic);


    // ================= ЭКРАН 3: ГОРИЗОНТАЛЬНЫЙ СЛАЙДЕР =================
    const hSlider = document.getElementById('hSlider');
    const dots = document.querySelectorAll('#dotsTrack .dot');
    let hLastStep = 1;

    hSlider.addEventListener('input', (e) => {
      const step = parseInt(e.target.value, 10) / 10;
      if (step !== hLastStep) {
        hLastStep = step;
        haptic('light');
        dots.forEach((d, i) => d.classList.toggle('active', i === step));
      }
    });

  </script>
</body>
</html>
